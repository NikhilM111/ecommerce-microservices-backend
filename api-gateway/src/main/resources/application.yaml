server:
  port: 8080

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive.handler.AbstractHandlerMapping: DEBUG

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # 1. Auth Service Route
            - id: auth-service
              uri: http://localhost:9000
              predicates:
                - Path=/api/user/**

            # 2. Product Service Route
            - id: product-service
              uri: http://localhost:9003
              predicates:
                - Path=/api/product/**

            # 3. Order Service Route
            - id: order-service
              uri: http://localhost:9001
              predicates:
                - Path=/api/orders/**

            # 4. Inventory Service Route
            - id: inventory-service
              uri: http://localhost:9002
              predicates:
                - Path=/api/inventory/**