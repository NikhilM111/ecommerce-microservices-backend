server:
  port: 9003
spring:
  application:
    name: product-model
  datasource:
    url: jdbc:postgresql://localhost:8004/product_db
    username: product_user
    password: product_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true